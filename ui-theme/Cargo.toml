[package]
name = "frost-night-egui"
version = "0.1.0"
edition = "2021"
description = "Frost Night egui design system — dark theme with glassmorphism support"

[dependencies]
egui = { workspace = true }
egui_flex = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
env_logger = { workspace = true }

[features]
default = ["icons"]
icons = []
composites = ["dep:egui_flex", "icons"]
demo = ["dep:eframe", "eframe/default_fonts", "eframe/wgpu", "composites", "icons"]
serde = ["dep:serde", "egui/serde"]

[[example]]
name = "demo"
required-features = ["demo"]

[[example]]
name = "export_css"
