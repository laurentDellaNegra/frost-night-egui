[package]
name = "skyscope-design-system"
version = "0.1.0"
edition = "2021"
description = "Skyscope Design System for egui — dark theme with glassmorphism support"

[dependencies]
egui = { workspace = true }
egui_flex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
default = ["icons"]
icons = []
composites = ["dep:egui_flex", "icons"]
serde = ["dep:serde", "egui/serde"]

[[example]]
name = "export_css"
